<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRSORGI Admin Panel</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0b1020;--card:#141b2d;--card2:#1a2238;--line:#293451;--text:#eef5ff;--muted:#91a0b8;--a:#14b8a6;--danger:#ef5350;--ok:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#182642 0,#0b1020 44%);color:var(--text);font:13px 'Plus Jakarta Sans',sans-serif}.side{width:260px;background:#0d1324;border-right:1px solid var(--line);padding:16px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:18px;font-weight:800;margin:8px 4px 22px}.brand span{color:var(--a)}.nav{display:grid;gap:5px}.nav button{border:0;background:none;color:var(--muted);text-align:left;padding:11px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--card2);color:#fff}.main{margin-left:260px;padding:24px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.search,.filter,.form input,.form select{background:var(--card);border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px;outline:0}.search{width:min(390px,100%)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.card,.stat{background:linear-gradient(145deg,var(--card),#10182a);border:1px solid var(--line);border-radius:15px;padding:16px}.stat small{color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid #315c62;background:#123337;color:#c8fff9;border-radius:9px;padding:9px 12px;cursor:pointer}.btn.primary{background:#0f766e;border-color:#14b8a6;color:#fff}.btn.danger{background:#3a1719;border-color:#7f2727;color:#ffb4b2}.btn.gray{background:#202a40;color:#dbe6f5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.service h3{font-size:14px;margin:8px 0}.service p{color:var(--muted);font-size:11px;min-height:30px}.icon{width:38px;height:38px;border-radius:10px;background:#123b3a;color:#2dd4bf;display:grid;place-items:center}.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#183d38;color:#8ef5e5;font-size:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}.table th{color:var(--muted)}.positive{color:var(--ok)}.negative{color:#fb7185}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:18px;z-index:10}.modal.on{display:grid}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#121a2d;border:1px solid var(--line);border-radius:17px;padding:20px}.close{float:right;border:0;background:none;color:#fff;font-size:22px;cursor:pointer}.form{display:grid;gap:10px}.form label{color:var(--muted);font-size:11px}.form input,.form select{width:100%;margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:35px}@media(max-width:900px){.side{position:static;width:100%;height:auto}.main{margin:0;padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.row{grid-template-columns:1fr}}</style></head><body><aside class="side"><div class="brand"><i class="fa-solid fa-shield-halved"></i> CR<span>SORGI</span> ADMIN</div><div class="nav"><button class="active" data-page="dashboard">⚡ Dashboard</button><button data-page="services">▦ Services</button><button data-page="ledger">◉ Wallet Ledger</button><button data-page="users">♙ User Management</button><button data-page="categories"># Categories</button></div></aside><main class="main"><div class="top"><div><h1 id="title" style="margin:0">Dashboard</h1><span style="color:var(--muted);font-size:11px">Fully client-side admin workspace</span></div><input class="search" id="search" placeholder="Search current page..." oninput="render()"></div><section id="content"></section></main><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>
const seed=[['Add Fast Payment 1','Wallet & Rewards'],['Add Fast Payment 2','Wallet & Rewards'],['Wallet History & Ledger','Wallet & Rewards'],['Play Free Spin','Wallet & Rewards'],['Spin History List','Wallet & Rewards'],['Aadhar Server 1 (Biometric)','Aadhaar & EID'],['Aadhar by Finger (OTP)','Aadhaar & EID'],['Advance Print List','Aadhaar & EID'],['Aadhar Manual','Aadhaar & EID'],['Aadhar Print List','Aadhaar & EID'],['EID to Aadhar Convert','Aadhaar & EID'],['EID Print List','Aadhaar & EID'],['Voter PDF Without OTP','Voter Services'],['Voter Mobile Link Instant','Voter Services'],['Original Voter PDF Download','Voter Services'],['Voter PDF Print List','Voter Services'],['Voter Manual','Voter Services'],['Voter Print List','Voter Services'],['Voter Manual Advance','Voter Services'],['Find PAN Detail','PAN Services'],['PAN Detail List','PAN Services'],['Find PAN (Server 1)','PAN Services'],['Find PAN (Server 2)','PAN Services'],['Find PAN List','PAN Services'],['PAN Manual','PAN Services'],['PAN Manual List','PAN Services'],['PAN Manual Advance','PAN Services'],['PAN Advance List','PAN Services'],['Aadhar to PAN Link','Aadhaar & EID'],['Mobile to PAN Search','PAN Services'],['Find Ayushman Card','Health Cards'],['Find DL Original PDF','Driving & Vehicle'],['Find DL Server 2','Driving & Vehicle'],['DL Print List','Driving & Vehicle'],['Find Vehicle RC','Driving & Vehicle'],['RC Print List','Driving & Vehicle'],['LL Test Pass','Driving & Vehicle'],['LL Test Print List','Driving & Vehicle'],['Create PUC Original','Driving & Vehicle'],['PUC Print List','Driving & Vehicle'],['Ration Card PDF','Food & Farmer'],['UP Ration to Aadhar','Food & Farmer'],['Farmer Card PDF 1','Food & Farmer'],['Farmer Card PDF 2 & List','Food & Farmer'],['UP Residence Apply','Certificates & State Services'],['UP Residence List','Certificates & State Services'],['UP Caste Apply','Certificates & State Services'],['UP Caste List','Certificates & State Services'],['UP Income Apply','Certificates & State Services'],['UP Income List','Certificates & State Services'],['Bihar Residence Apply','Certificates & State Services'],['Bihar Residence List','Certificates & State Services'],['Bihar Caste Apply','Certificates & State Services'],['Bihar Caste List','Certificates & State Services'],['Bihar Income Apply','Certificates & State Services'],['Bihar Income List','Certificates & State Services'],['Find IFSC Code','Banking & Utilities'],['NPCI Bank Link Status','Banking & Utilities'],['All State Birth Apply','Certificates & State Services'],['Birth Print List','Certificates & State Services'],['Delhi Apply','Certificates & State Services'],['Delhi Print List','Certificates & State Services'],['Gazette Apply','Certificates & State Services'],['Gazette Print List','Certificates & State Services'],['Death Certificate Apply','Certificates & State Services'],['Death Print List','Certificates & State Services'],['Create Covid Certificate','Health Cards'],['Covid Print List','Health Cards'],['Add Birth Hospital','Certificates & State Services'],['Birth Hospital List','Certificates & State Services']];
let services=JSON.parse(localStorage.getItem('cr_services')||'null')||seed.map((x,i)=>({id:i+1,name:x[0],cat:x[1],price:0,active:true}));let users=JSON.parse(localStorage.getItem('cr_users')||'null')||[{id:1,name:'Admin',email:'admin@example.com',role:'Admin',status:'Active',balance:0},{id:2,name:'Demo User',email:'user@example.com',role:'User',status:'Active',balance:250}];let ledger=JSON.parse(localStorage.getItem('cr_ledger')||'null')||[{id:1,user:'Demo User',type:'credit',amount:250,note:'Opening balance',date:new Date().toISOString()}];let page='dashboard',filter='All';let cats=()=>[...new Set(services.map(x=>x.cat))];const save=()=>{localStorage.setItem('cr_services',JSON.stringify(services));localStorage.setItem('cr_users',JSON.stringify(users));localStorage.setItem('cr_ledger',JSON.stringify(ledger))};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const modal=h=>{modalEl().classList.add('on');document.getElementById('modalBody').innerHTML=h};const modalEl=()=>document.getElementById('modal');function closeModal(){modalEl().classList.remove('on')};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;filter='All';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('search').value='';render()});function render(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('title').textContent=page[0].toUpperCase()+page.slice(1);({dashboard,servicesPage,ledgerPage,usersPage,categoriesPage}[page==='services'?'servicesPage':page==='ledger'?'ledgerPage':page==='users'?'usersPage':page==='categories'?'categoriesPage':'dashboard'])(q)}
function dashboard(){let c=ledger.filter(x=>x.type==='credit').reduce((a,x)=>a+x.amount,0),d=ledger.filter(x=>x.type==='debit').reduce((a,x)=>a+x.amount,0);document.getElementById('content').innerHTML=`<div class=stats><div class=stat><small>Total Services</small><b>${services.length}</b></div><div class=stat><small>Active Services</small><b>${services.filter(x=>x.active).length}</b></div><div class=stat><small>Users</small><b>${users.length}</b></div><div class=stat><small>Ledger Entries</small><b>${ledger.length}</b></div><div class=stat><small>Net Wallet Flow</small><b>${money(c-d)}</b></div></div><div class=toolbar><button class="btn primary" onclick="serviceForm()">+ Add Service</button><button class=btn onclick="userForm()">+ Add User</button><button class=btn onclick="txnForm()">+ Ledger Entry</button></div><div class=card><h3>Recent Ledger</h3>${ledgerTable(ledger.slice().reverse().slice(0,8),false)}</div>`}
function servicesPage(q){let rows=services.filter(x=>(filter==='All'||x.cat===filter)&&(!q||x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)));document.getElementById('content').innerHTML=`<div class=toolbar><button class="btn primary" onclick="serviceForm()">+ Add Service</button><select class=filter onchange="filter=this.value;render()"><option>All</option>${cats().map(c=>`<option ${c===filter?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn gray" onclick="exportData()">Export JSON</button></div><div class=grid>${rows.map(x=>`<article class="card service"><div class=icon>▦</div><h3>${esc(x.name)}</h3><p>${esc(x.cat)} · ${money(x.price)}</p><span class=badge>${x.active?'ACTIVE':'DISABLED'}</span><div class=toolbar><button class=btn onclick="serviceForm(${x.id})">Edit</button><button class="btn gray" onclick="toggleService(${x.id})">${x.active?'Disable':'Enable'}</button><button class="btn danger" onclick="deleteService(${x.id})">Delete</button></div></article>`).join('')||'<div class=empty>No services found</div>'}</div>`}
function serviceForm(id){let x=services.find(a=>a.id===id)||{name:'',cat:filter==='All'?(cats()[0]||'General'):filter,price:0,active:true};modal(`<h2>${id?'Edit':'Add'} Service</h2><form class=form onsubmit="saveService(event,${id||0})"><label>Name<input id=sn required value="${esc(x.name)}"></label><label>Category<input id=sc required value="${esc(x.cat)}"></label><label>Price<input id=sp type=number min=0 step=.01 value="${x.price}"></label><label>Status<select id=sa><option value=1 ${x.active?'selected':''}>Active</option><option value=0 ${!x.active?'selected':''}>Disabled</option></select></label><button class="btn primary">Save Service</button></form>`)}function saveService(e,id){e.preventDefault();let x={id:id||Date.now(),name:sn.value.trim(),cat:sc.value.trim(),price:Number(sp.value||0),active:sa.value==='1'};services=id?services.map(a=>a.id===id?x:a):[...services,x];save();closeModal();render()}function toggleService(id){let x=services.find(a=>a.id===id);x.active=!x.active;save();render()}function deleteService(id){if(confirm('Delete this service?')){services=services.filter(x=>x.id!==id);save();render()}}function exportData(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(services,null,2));a.download='services.json';a.click()}
function ledgerPage(q){let rows=ledger.filter(x=>!q||x.user.toLowerCase().includes(q)||x.note.toLowerCase().includes(q)||x.type.includes(q));let bal=ledger.reduce((a,x)=>a+(x.type==='credit'?x.amount:-x.amount),0);document.getElementById('content').innerHTML=`<div class=stats><div class=stat><small>Balance</small><b>${money(bal)}</b></div><div class=stat><small>Credits</small><b>${money(ledger.filter(x=>x.type==='credit').reduce((a,x)=>a+x.amount,0))}</b></div><div class=stat><small>Debits</small><b>${money(ledger.filter(x=>x.type==='debit').reduce((a,x)=>a+x.amount,0))}</b></div></div><div class=toolbar><button class="btn primary" onclick="txnForm()">+ Add Transaction</button><button class="btn gray" onclick="clearLedger()">Clear Ledger</button></div><div class=card>${ledgerTable(rows.slice().reverse(),true)}</div>`}function ledgerTable(rows,actions){return `<div class=tablewrap><table class=table><thead><tr><th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Note</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${esc(x.user)}</td><td>${x.type}</td><td class=${x.type==='credit'?'positive':'negative'}>${money(x.amount)}</td><td>${esc(x.note)}</td>${actions?`<td><button class="btn danger" onclick="deleteTxn(${x.id})">Delete</button></td>`:''}</tr>`).join('')||'<tr><td colspan=6 class=empty>No entries</td></tr>'}</tbody></table></div>`}function txnForm(){modal(`<h2>Add Wallet Transaction</h2><form class=form onsubmit="saveTxn(event)"><label>User<select id=tu>${users.map(u=>`<option>${esc(u.name)}</option>`).join('')}</select></label><div class=row><label>Type<select id=tt><option value=credit>Credit</option><option value=debit>Debit</option></select></label><label>Amount<input id=ta type=number min=.01 step=.01 required></label></div><label>Note<input id=tn required></label><button class="btn primary">Save Transaction</button></form>`)}function saveTxn(e){e.preventDefault();let amount=Number(ta.value);let u=users.find(x=>x.name===tu.value);ledger.push({id:Date.now(),user:tu.value,type:tt.value,amount,note:tn.value,date:new Date().toISOString()});if(u)u.balance+=(tt.value==='credit'?amount:-amount);save();closeModal();render()}function deleteTxn(id){if(confirm('Delete transaction?')){let x=ledger.find(t=>t.id===id),u=x&&users.find(a=>a.name===x.user);if(u)u.balance-=(x.type==='credit'?x.amount:-x.amount);ledger=ledger.filter(t=>t.id!==id);save();render()}}function clearLedger(){if(confirm('Clear all ledger entries?')){ledger=[];save();render()}}
function usersPage(q){let rows=users.filter(x=>!q||x.name.toLowerCase().includes(q)||x.email.toLowerCase().includes(q)||x.role.toLowerCase().includes(q));document.getElementById('content').innerHTML=`<div class=toolbar><button class="btn primary" onclick="userForm()">+ Add User</button></div><div class=card>${`<div class=tablewrap><table class=table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Balance</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${x.status}</td><td>${money(x.balance)}</td><td><button class=btn onclick="userForm(${x.id})">Edit</button> <button class="btn gray" onclick="toggleUser(${x.id})">${x.status==='Active'?'Disable':'Enable'}</button> <button class="btn danger" onclick="deleteUser(${x.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}</div>`}function userForm(id){let x=users.find(a=>a.id===id)||{name:'',email:'',role:'User',status:'Active',balance:0};modal(`<h2>${id?'Edit':'Add'} User</h2><form class=form onsubmit="saveUser(event,${id||0})"><label>Name<input id=un required value="${esc(x.name)}"></label><label>Email<input id=ue type=email required value="${esc(x.email)}"></label><div class=row><label>Role<select id=ur><option ${x.role==='Admin'?'selected':''}>Admin</option><option ${x.role==='Manager'?'selected':''}>Manager</option><option ${x.role==='User'?'selected':''}>User</option></select></label><label>Status<select id=us><option ${x.status==='Active'?'selected':''}>Active</option><option ${x.status==='Disabled'?'selected':''}>Disabled</option></select></label></div><label>Opening Balance<input id=ub type=number step=.01 value="${x.balance}" ${id?'readonly':''}></label><button class="btn primary">Save User</button></form>`)}function saveUser(e,id){e.preventDefault();let old=users.find(x=>x.id===id);let x={id:id||Date.now(),name:un.value.trim(),email:ue.value.trim(),role:ur.value,status:us.value,balance:id?old.balance:Number(ub.value||0)};users=id?users.map(a=>a.id===id?x:a):[...users,x];save();closeModal();render()}function toggleUser(id){let x=users.find(a=>a.id===id);x.status=x.status==='Active'?'Disabled':'Active';save();render()}function deleteUser(id){if(confirm('Delete this user?')){users=users.filter(x=>x.id!==id);save();render()}}
function categoriesPage(q){let counts={};services.forEach(x=>counts[x.cat]=(counts[x.cat]||0)+1);let rows=Object.entries(counts).filter(([c])=>!q||c.toLowerCase().includes(q));document.getElementById('content').innerHTML=`<div class=toolbar><button class="btn primary" onclick="categoryForm()">+ Add Category</button></div><div class=grid>${rows.map(([c,n])=>`<div class=card><h3>${esc(c)}</h3><p style="color:var(--muted)">${n} services</p><button class=btn onclick="filter='${esc(c)}';page='services';document.querySelector('[data-page=services]').click()">View Services</button> <button class="btn danger" onclick="deleteCategory('${esc(c)}')">Delete</button></div>`).join('')}</div>`}function categoryForm(){modal(`<h2>Add Category</h2><form class=form onsubmit="saveCategory(event)"><label>Name<input id=cn required></label><button class="btn primary">Add Category</button></form>`)}function saveCategory(e){e.preventDefault();let c=cn.value.trim();if(c&&!cats().includes(c)){services.push({id:Date.now(),name:'New Service',cat:c,price:0,active:true});save();closeModal();render()}}function deleteCategory(c){if(confirm('Delete category and all its services?')){services=services.filter(x=>x.cat!==c);save();render()}}save();render();
</script></body></html>
