<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRPWORK — Controls & Reports</title><style>:root{--bg:#0b1020;--card:#141b2d;--line:#293451;--text:#eef5ff;--muted:#91a0b8;--a:#14b8a6;--bad:#fb7185;--ok:#34d399;--warn:#fbbf24}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:var(--text);font:13px Arial,sans-serif}.wrap{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0e1425;border-right:1px solid var(--line);padding:16px}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:11px;border-radius:9px;margin:4px 0;cursor:pointer}.side button.active,.side button:hover{background:#1a2238;color:#fff}.main{padding:22px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.card{background:linear-gradient(145deg,#141b2d,#10182a);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:1px solid #315c62;background:#123337;color:#d8fffb;border-radius:8px;padding:9px 11px;cursor:pointer}.primary{background:#0f766e}.danger{background:#3a1719;border-color:#7f2727;color:#ffc0c0}.warn{background:#3b2d0d;border-color:#735b18;color:#ffe49a}.input,.select{background:#0f172a;border:1px solid var(--line);color:#fff;padding:9px;border-radius:8px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}.table th{color:var(--muted)}.pill{padding:4px 7px;border-radius:20px;font-size:10px}.pending{background:#3b2d0d;color:#ffe49a}.approved{background:#123d34;color:#8ef5df}.rejected{background:#40191e;color:#ffb3be}.mismatch{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:18px}.modal.on{display:grid}.box{width:min(600px,100%);background:#121a2d;border:1px solid var(--line);border-radius:16px;padding:18px}.form{display:grid;gap:10px}.form input,.form select{background:#0f172a;color:#fff;border:1px solid var(--line);padding:10px;border-radius:8px}.close{float:right;background:none;border:0;color:#fff;font-size:22px}@media(max-width:850px){.wrap{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><aside class="side"><h3>CRPWORK</h3><button class="active" data-p="audit">Audit Logs</button><button data-p="approval">Wallet Approval</button><button data-p="reconcile">Reconciliation</button><button data-p="reports">Reports</button></aside><main class="main"><h1 id="title">Audit Logs</h1><div id="app"></div></main></div><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeM()">×</button><div id="mb"></div></div></div><script>
const K={audit:'cr_audit_v1',pending:'cr_pending_v1',ledger:'cr_ledger',users:'cr_users'};const load=k=>JSON.parse(localStorage.getItem(k)||'[]');const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let audits=load(K.audit),pending=load(K.pending),ledger=load(K.ledger),users=load(K.users);let current='audit';
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return ('00000000'+(h>>>0).toString(16)).slice(-8)}function audit(action,detail){let prev=audits.at(-1)?.hash||'GENESIS';let e={id:crypto.randomUUID(),ts:new Date().toISOString(),actor:sessionStorage.getItem('cr_actor')||'Admin',action,detail,prevHash:prev};e.hash=hash(JSON.stringify(e));audits.push(e);save(K.audit,audits)}function verify(){let prev='GENESIS';for(const e of audits){let copy={...e};delete copy.hash;if(e.prevHash!==prev||e.hash!==hash(JSON.stringify(copy)))return false;prev=e.hash}return true}
function duplicateFingerprint(x){return [x.user,x.type,Number(x.amount).toFixed(2),String(x.note||'').trim().toLowerCase(),x.date.slice(0,16)].join('|')}function addPending(x){let fp=duplicateFingerprint(x);if(pending.some(p=>p.fingerprint===fp)||ledger.some(p=>duplicateFingerprint(p)===fp))throw Error('Duplicate transaction detected');x.fingerprint=fp;x.status='Pending';x.id=crypto.randomUUID();x.createdAt=new Date().toISOString();pending.push(x);save(K.pending,pending);audit('WALLET_SUBMITTED',`Pending transaction ${x.id} for ${x.user}`)}
function approve(id){let p=pending.find(x=>x.id===id);if(!p)return;if(p.status!=='Pending')return;let u=users.find(x=>x.name===p.user);if(p.type==='debit'&&u&&Number(u.balance)<Number(p.amount))return alert('Insufficient user balance');p.status='Approved';p.approvedAt=new Date().toISOString();ledger.push({...p,approvedBy:sessionStorage.getItem('cr_actor')||'Admin'});if(u)u.balance+=(p.type==='credit'?Number(p.amount):-Number(p.amount));save(K.pending,pending);save(K.ledger,ledger);save(K.users,users);audit('WALLET_APPROVED',`Approved ${p.id}`);render()}
function reject(id){let p=pending.find(x=>x.id===id);if(!p)return;let reason=prompt('Rejection reason','Duplicate / invalid / review failed');if(reason===null)return;p.status='Rejected';p.rejectedAt=new Date().toISOString();p.reason=reason;save(K.pending,pending);audit('WALLET_REJECTED',`${p.id}: ${reason}`);render()}
function reconcile(){let result=users.map(u=>{let expected=ledger.filter(x=>x.user===u.name&&x.status!=='Rejected').reduce((a,x)=>a+(x.type==='credit'?1:-1)*Number(x.amount),0);return {...u,expected,diff:Number(u.balance)-expected}});return result}
function csv(name,rows){let text=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(text);a.download=name;a.click()}
function render(){document.getElementById('title').textContent={audit:'Immutable Audit Logs',approval:'Wallet Transaction Approval',reconcile:'Balance Reconciliation',reports:'Exportable Reports'}[current];if(current==='audit')auditPage();if(current==='approval')approvalPage();if(current==='reconcile')reconcilePage();if(current==='reports')reportPage()}
function auditPage(){document.getElementById('app').innerHTML=`<div class="toolbar"><button class="btn ${verify()?'primary':'danger'}" onclick="alert(verify()?'Audit chain verified':'Audit chain integrity FAILED')">Verify Chain</button><button class="btn" onclick="csv('audit-log.csv',[['Timestamp','Actor','Action','Detail','Previous Hash','Hash'],...audits.map(x=>[x.ts,x.actor,x.action,x.detail,x.prevHash,x.hash])])">Export CSV</button></div><div class=card><p style="color:var(--muted)">Append-only hash-chain log. Browser storage is tamper-evident, not cryptographically immutable; true immutable retention requires server/database append-only storage.</p><div class=tablewrap><table class=table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th><th>Hash</th></tr>${audits.slice().reverse().map(x=>`<tr><td>${new Date(x.ts).toLocaleString()}</td><td>${x.actor}</td><td>${x.action}</td><td>${x.detail}</td><td>${x.hash}</td></tr>`).join('')}</table></div></div>`}
function approvalPage(){document.getElementById('app').innerHTML=`<div class=toolbar><button class="btn primary" onclick="newTxn()">+ Submit Transaction</button><span style="color:var(--muted);padding:8px">Pending: ${pending.filter(x=>x.status==='Pending').length}</span></div><div class=card><div class=tablewrap><table class=table><tr><th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Note</th><th>Status</th><th>Action</th></tr>${pending.slice().reverse().map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString()}</td><td>${x.user}</td><td>${x.type}</td><td>₹${Number(x.amount).toFixed(2)}</td><td>${x.note}</td><td><span class="pill ${x.status.toLowerCase()}">${x.status}</span></td><td>${x.status==='Pending'?`<button class="btn primary" onclick="approve('${x.id}')">Approve</button> <button class="btn danger" onclick="reject('${x.id}')">Reject</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function newTxn(){document.getElementById('mb').innerHTML=`<h2>Submit Wallet Transaction</h2><form class=form onsubmit="submitTxn(event)"><label>User<select id=tuser>${users.map(u=>`<option>${u.name}</option>`).join('')}</select></label><label>Type<select id=ttype><option value=credit>Credit</option><option value=debit>Debit</option></select></label><label>Amount<input id=tamount type=number min=.01 step=.01 required></label><label>Note<input id=tnote required></label><button class="btn primary">Submit for Approval</button></form>`;document.getElementById('modal').classList.add('on')}function submitTxn(e){e.preventDefault();try{addPending({user:tuser.value,type:ttype.value,amount:Number(tamount.value),note:tnote.value,date:new Date().toISOString()});closeM();render()}catch(err){alert(err.message)}}function closeM(){document.getElementById('modal').classList.remove('on')}
function reconcilePage(){let r=reconcile();document.getElementById('app').innerHTML=`<div class=toolbar><button class="btn primary" onclick="reconcile()&&render()">Refresh</button><button class=btn onclick="csv('reconciliation.csv',[['User','Recorded Balance','Ledger Balance','Difference','Status'],...r.map(x=>[x.name,x.balance,x.expected,x.diff,x.diff===0?'OK':'MISMATCH'])])">Export CSV</button></div><div class=card><div class=tablewrap><table class=table><tr><th>User</th><th>Recorded</th><th>Ledger</th><th>Difference</th><th>Status</th></tr>${r.map(x=>`<tr><td>${x.name}</td><td>₹${Number(x.balance).toFixed(2)}</td><td>₹${Number(x.expected).toFixed(2)}</td><td class=${x.diff?'mismatch':'ok'}>₹${Number(x.diff).toFixed(2)}</td><td>${x.diff?'MISMATCH':'OK'}</td></tr>`).join('')}</table></div></div>`}
function reportPage(){let approved=pending.filter(x=>x.status==='Approved'),rejected=pending.filter(x=>x.status==='Rejected');document.getElementById('app').innerHTML=`<div class=stats><div class=card><small>Approved</small><h2>${approved.length}</h2></div><div class=card><small>Rejected</small><h2>${rejected.length}</h2></div><div class=card><small>Pending</small><h2>${pending.filter(x=>x.status==='Pending').length}</h2></div><div class=card><small>Audit Events</small><h2>${audits.length}</h2></div></div><div class=toolbar><button class="btn primary" onclick="exportAll()">Export Full CSV Bundle</button><button class=btn onclick="csv('wallet-ledger.csv',[['Date','User','Type','Amount','Note','Status'],...ledger.map(x=>[x.date,x.user,x.type,x.amount,x.note,x.status||'Approved'])])">Wallet CSV</button><button class=btn onclick="csv('users.csv',[['Name','Email','Role','Status','Balance'],...users.map(x=>[x.name,x.email,x.role,x.status,x.balance])])">Users CSV</button></div>`}function exportAll(){csv('audit.csv',[['Timestamp','Actor','Action','Detail','PrevHash','Hash'],...audits.map(x=>[x.ts,x.actor,x.action,x.detail,x.prevHash,x.hash])]);setTimeout(()=>csv('reconciliation.csv',[['User','Recorded','Ledger','Difference'],...reconcile().map(x=>[x.name,x.balance,x.expected,x.diff])]),150)}document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.p;render()});if(!audits.length)audit('SYSTEM_INIT','Controls module initialized');render();
</script></body></html>
