<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRPWORK — Secure Admin Controls</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0b1020;--card:#141b2d;--line:#293451;--text:#eef5ff;--muted:#91a0b8;--a:#14b8a6;--bad:#fb7185;--ok:#34d399;--warn:#fbbf24}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:var(--text);font:13px Arial,sans-serif}.wrap{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0e1425;border-right:1px solid var(--line);padding:16px}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:11px;border-radius:9px;margin:4px 0;cursor:pointer}.side button.active,.side button:hover{background:#1a2238;color:#fff}.main{padding:22px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card{background:linear-gradient(145deg,#141b2d,#10182a);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:1px solid #315c62;background:#123337;color:#d8fffb;border-radius:8px;padding:9px 11px;cursor:pointer}.primary{background:#0f766e}.danger{background:#3a1719;border-color:#7f2727;color:#ffc0c0}.input,.select{background:#0f172a;border:1px solid var(--line);color:#fff;padding:9px;border-radius:8px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}.table th{color:var(--muted)}.pill{padding:4px 7px;border-radius:20px;font-size:10px}.pending{background:#3b2d0d;color:#ffe49a}.approved{background:#123d34;color:#8ef5df}.rejected{background:#40191e;color:#ffb3be}.mismatch{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}.auth{max-width:430px;margin:8vh auto}.auth input{width:100%;margin:6px 0;padding:12px;background:#0f172a;color:#fff;border:1px solid var(--line);border-radius:8px}.hidden{display:none}@media(max-width:850px){.wrap{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="auth card"><h2>CRPWORK Secure Admin</h2><p style="color:var(--muted)">Sign in with your Supabase account. Database RLS controls authorization.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn primary" style="width:100%">Sign in</button></form><p id="authMsg"></p></div><div id="appShell" class="wrap hidden"><aside class="side"><h3>CRPWORK</h3><div id="identity" style="color:var(--muted);font-size:11px;margin-bottom:12px"></div><button class="active" data-p="audit">Audit Logs</button><button data-p="approval">Wallet Approval</button><button data-p="reconcile">Reconciliation</button><button data-p="reports">Reports</button><button id="logout">Sign out</button></aside><main class="main"><h1 id="title">Audit Logs</h1><div id="app"></div></main></div><script>
const SUPABASE_URL='https://akgkebtxtgzfatdowscb.supabase.co';const SUPABASE_KEY='sb_publishable_SP3yvI80dTYTWL42obFeNg_Hpoa-bf4';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let current='audit',role=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return showLogin();const {data:p,error}=await sb.from('profiles').select('role,display_name').eq('id',session.user.id).single();if(error||!p||!['admin','manager'].includes(p.role)){await sb.auth.signOut();return showLogin('No admin/manager profile is assigned to this account.');}role=p.role;document.getElementById('identity').textContent=(p.display_name||session.user.email)+' · '+role;document.getElementById('login').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');render()}
function showLogin(msg=''){document.getElementById('login').classList.remove('hidden');document.getElementById('appShell').classList.add('hidden');document.getElementById('authMsg').textContent=msg}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return authMsg.textContent=error.message;boot()};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();showLogin()};sb.auth.onAuthStateChange(()=>boot());
document.querySelectorAll('.side button[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.side button[data-p]').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.p;render()});
async function render(){document.getElementById('title').textContent={audit:'Immutable Audit Logs',approval:'Wallet Transaction Approval',reconcile:'Balance Reconciliation',reports:'Reports'}[current];if(current==='audit')return auditPage();if(current==='approval')return approvalPage();if(current==='reconcile')return reconcilePage();return reportPage()}
async function auditPage(){const {data,error}=await sb.from('audit_logs').select('id,occurred_at,actor_id,action,entity_type,entity_id,details,previous_hash,entry_hash').order('id',{ascending:false}).limit(500);document.getElementById('app').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="verifyServerChain()">Verify Hash Chain</button><button class="btn" onclick="exportAudit()">Export CSV</button></div><div class=card><p style="color:var(--muted)">${error?esc(error.message):'Audit records are database-backed and client writes are blocked by RLS. UPDATE/DELETE are rejected by a database trigger.'}</p><div class=tablewrap><table class=table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th><th>Hash</th></tr>${(data||[]).map(x=>`<tr><td>${new Date(x.occurred_at).toLocaleString()}</td><td>${esc(x.actor_id||'system')}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type)} ${esc(x.entity_id||'')}</td><td>${esc(JSON.stringify(x.details))}</td><td>${esc(x.entry_hash)}</td></tr>`).join('')}</table></div></div>`}
async function verifyServerChain(){const {data,error}=await sb.from('audit_logs').select('id,previous_hash,entry_hash').order('id');if(error)return alert(error.message);let prev=null,ok=true;for(const x of data||[]){if(x.previous_hash!==prev){ok=false;break}prev=x.entry_hash}alert(ok?'Server audit chain links are intact.':'Audit chain link mismatch detected.');}
async function approvalPage(){let q=sb.from('wallet_transactions').select('*').order('created_at',{ascending:false}).limit(500);if(role==='manager')q=q;const {data,error}=await q;document.getElementById('app').innerHTML=`<div class=toolbar><button class="btn primary" onclick="newTxn()">+ Submit Transaction</button><span style="color:var(--muted);padding:8px">Pending: ${(data||[]).filter(x=>x.status==='pending').length}</span></div><div class=card><div class=tablewrap><table class=table><tr><th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th><th>Reason</th><th>Action</th></tr>${(data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.user_id)}</td><td>${x.type}</td><td>${money(x.amount)}</td><td><span class="pill ${x.status}">${x.status}</span></td><td>${esc(x.rejection_reason||'')}</td><td>${x.status==='pending'&&role==='admin'?`<button class="btn primary" onclick="approveTxn('${x.id}',true)">Approve</button> <button class="btn danger" onclick="approveTxn('${x.id}',false)">Reject</button>`:''}</td></tr>`).join('')}</table></div></div>`}
async function newTxn(){const {data:profiles}=await sb.from('profiles').select('id,display_name');document.getElementById('app').insertAdjacentHTML('afterbegin',`<div class=card><form id=txForm><select class=select id=txUser required>${(profiles||[]).map(x=>`<option value="${x.id}">${esc(x.display_name||x.id)}</option>`).join('')}</select> <select class=select id=txType><option value=credit>Credit</option><option value=debit>Debit</option></select> <input class=input id=txAmount type=number min=.01 step=.01 placeholder=Amount required> <input class=input id=txNote placeholder=Note required> <button class="btn primary">Submit</button></form></div>`);document.getElementById('txForm').onsubmit=async e=>{e.preventDefault();const fp=await fingerprint({user:txUser.value,type:txType.value,amount:Number(txAmount.value),note:txNote.value});const {error}=await sb.rpc('request_wallet_transaction',{p_user_id:txUser.value,p_type:txType.value,p_amount:Number(txAmount.value),p_note:txNote.value,p_fingerprint:fp});if(error)alert(error.message);else render()}}
async function fingerprint(x){const s=[x.user,x.type,Number(x.amount).toFixed(2),String(x.note).trim().toLowerCase(),new Date().toISOString().slice(0,16)].join('|');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function approveTxn(id,approve){let reason=null;if(!approve){reason=prompt('Rejection reason','Review failed');if(reason===null)return}const {error}=await sb.rpc('approve_wallet_transaction',{p_txid:id,p_approve:approve,p_reason:reason});if(error)alert(error.message);else render()}
async function reconcilePage(){const {data:profiles}=await sb.from('profiles').select('id,display_name');let rows=[];for(const p of profiles||[]){const {data,error}=await sb.rpc('reconcile_wallet',{p_user_id:p.id});if(!error&&data?.[0])rows.push({...p,...data[0]})}document.getElementById('app').innerHTML=`<div class=toolbar><button class="btn primary" onclick="reconcilePage()">Refresh</button><button class=btn onclick="exportReconcile()">Export CSV</button></div><div class=card><div class=tablewrap><table class=table><tr><th>User</th><th>Ledger</th><th>Account</th><th>Difference</th><th>Status</th></tr>${rows.map(x=>`<tr><td>${esc(x.display_name||x.id)}</td><td>${money(x.ledger_balance)}</td><td>${money(x.account_balance)}</td><td class=${Number(x.difference)?'mismatch':'ok'}>${money(x.difference)}</td><td>${Number(x.difference)?'MISMATCH':'OK'}</td></tr>`).join('')}</table></div></div>`;window._reconcileRows=rows}
async function reportPage(){const [{data:a},{data:t}]=await Promise.all([sb.from('audit_logs').select('id,occurred_at,actor_id,action,entity_type,entity_id,details,previous_hash,entry_hash').order('id',{ascending:false}).limit(1000),sb.from('wallet_transactions').select('*').order('created_at',{ascending:false}).limit(1000)]);document.getElementById('app').innerHTML=`<div class=stats><div class=card><small>Audit Events</small><b>${(a||[]).length}</b></div><div class=card><small>Pending</small><b>${(t||[]).filter(x=>x.status==='pending').length}</b></div><div class=card><small>Approved</small><b>${(t||[]).filter(x=>x.status==='approved').length}</b></div><div class=card><small>Rejected</small><b>${(t||[]).filter(x=>x.status==='rejected').length}</b></div></div><div class=toolbar><button class="btn primary" onclick="csv('wallet-transactions.csv',[['Date','User','Type','Amount','Status','Note'],...(t||[]).map(x=>[x.created_at,x.user_id,x.type,x.amount,x.status,x.note])])">Wallet CSV</button><button class=btn onclick="csv('audit-log.csv',[['Time','Actor','Action','Entity','Details','Hash'],...(a||[]).map(x=>[x.occurred_at,x.actor_id,x.action,x.entity_type,JSON.stringify(x.details),x.entry_hash])])">Audit CSV</button></div>`}
async function exportAudit(){const {data}=await sb.from('audit_logs').select('*').order('id');csv('audit-log.csv',[['Time','Actor','Action','Entity','Details','Previous Hash','Hash'],...(data||[]).map(x=>[x.occurred_at,x.actor_id,x.action,x.entity_type,JSON.stringify(x.details),x.previous_hash,x.entry_hash])])}async function exportReconcile(){await reconcilePage();const r=window._reconcileRows||[];csv('reconciliation.csv',[['User','Ledger','Account','Difference','Status'],...r.map(x=>[x.display_name,x.ledger_balance,x.account_balance,x.difference,Number(x.difference)?'MISMATCH':'OK'])])}function csv(name,rows){const text=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(text);a.download=name;a.click()}
boot();</script></body></html>
